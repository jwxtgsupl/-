<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .bg-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url("./1.png") no-repeat center;
            background-size: cover; 
        }
        .form-group {
            position: absolute;
            top: 386px;
            left: 400px;
            display: flex;
            flex-direction: column;
            gap: 36px;
        }
        .form-group input {
            width: 312px;
            height: 46px;
            padding: 0 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-group button {
            width: 334px;
            height: 46px;
            background-color: #458bf5;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 21px;
        }
    </style>
</head>
<body>
    <div class="bg-container">
        <div class="form-group">
            <input type="text" id="input1" placeholder="请输入用户名">
            <input type="text" id="input2" placeholder="请输入密码">
            <button onclick="submitForm()">登录</button>
        </div>
    </div>

    <script>
        function submitForm() {
            // 获取输入框内容
            const text1 = document.getElementById('input1').value;
            const text2 = document.getElementById('input2').value;

            fetch('http://localhost:3000/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text1, text2 })
            }).then(res => {
                alert('输入的内容已保存！');
                document.getElementById('input1').value = '';
                document.getElementById('input2').value = '';
            });
        }
    </script>
</body>

</html>
